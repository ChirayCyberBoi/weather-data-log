<!DOCTYPE html>
<html>
<head>

<title>Weather Data Log</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
    .hero{
    height:250px;
   background-image:url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21');
    background-size:cover;
    background-position:center;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    margin-bottom:30px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}


body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:30px;
    background: linear-gradient(to right, #4facfe, #00f2fe);
}

.hero h1{
    font-family: 'Poppins', sans-serif;
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:55px;
    font-weight:700;
    letter-spacing:2px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
}
.container{
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding:30px;
    border-radius:20px;
    max-width:1000px;
    margin:auto;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

input{
    padding:12px;
    margin:10px 5px;
    border:none;
    border-radius:10px;
    width:220px;
    font-size:15px;
    outline:none;
}

button{
    padding:12px 18px;
    margin:10px 5px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.05);
}

table{
    width:100%;
    margin-top:25px;
    border-collapse:collapse;
    background:white;
    border-radius:15px;
    overflow:hidden;
}

th{
    background:#007bff;
    color:white;
    padding:15px;
}

td{
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f2f2f2;
}

tr:hover{
    background:#dfefff;
}

table, th, td{
    border:none;
}

.search-box{
    margin-top:20px;
}

</style>
</head>
</div>
<body>
    <div class="container"></div>

    <div class="hero">

    <h1>☁️ Weather Data Log</h1>

    <p style="color:white; font-size:18px;">
        Track Weather Forecast & Climate Records
    </p>

</div>

    <input type="text" id="city" placeholder="City">

    <input type="text" id="temp" placeholder="Temperature">

    <input type="text" id="humidity" placeholder="Humidity">

    <input type="text" id="weather" placeholder="Weather Condition">

    <button onclick="addData()">Save</button>

<input type="text" id="search" placeholder="Search City">

<button onclick="searchData()">Search</button>

<table border="1" id="weatherTable">

        <tr>
            <th>City</th>
            <th>Temperature</th>
            <th>Humidity</th>
            <th>Weather</th>
            <th>Action</th>
        </tr>

    </table>

    <script>

let weatherData = JSON.parse(localStorage.getItem("weatherData")) || [];

displayData();

function addData(){

    let city = document.getElementById("city").value;

    let temp = document.getElementById("temp").value;

    let humidity = document.getElementById("humidity").value;

    let weather = document.getElementById("weather").value;

    let data = {
        city: city,
        temp: temp,
        humidity: humidity,
        weather: weather
    };

    weatherData.push(data);

    localStorage.setItem("weatherData",
    JSON.stringify(weatherData));

    displayData();

}

function displayData(){

    let table = document.getElementById("weatherTable");

    table.innerHTML = `
        <tr>
            <th>City</th>
            <th>Temperature</th>
            <th>Humidity</th>
            <th>Weather</th>
            <th>Action</th>
        </tr>
    `;

    weatherData.forEach(function(data, index){

        let row = table.insertRow();

        row.insertCell(0).innerHTML = data.city;
        row.insertCell(1).innerHTML = data.temp;
        row.insertCell(2).innerHTML = data.humidity;
       let weatherEmoji = "";

if(data.weather.toLowerCase() == "sunny"){
    weatherEmoji = "☀️ Sunny";
}
else if(data.weather.toLowerCase() == "rainy"){
    weatherEmoji = "🌧️ Rainy";
}
else if(data.weather.toLowerCase() == "cloudy"){
    weatherEmoji = "☁️ Cloudy";
}
else if(data.weather.toLowerCase() == "storm"){
    weatherEmoji = "⛈️ Storm";
}
else{
    weatherEmoji = "🌤️ " + data.weather;
}

row.insertCell(3).innerHTML = weatherEmoji;

        row.insertCell(4).innerHTML =
        '<button onclick="deleteData(' + index + ')">Delete</button>';

    });

}

function searchData(){

    let search = document.getElementById("search").value.toLowerCase();

    let filteredData = weatherData.filter(function(data){

        return data.city.toLowerCase().includes(search);

    });

    let table = document.getElementById("weatherTable");

    table.innerHTML = `
        <tr>
            <th>City</th>
            <th>Temperature</th>
            <th>Humidity</th>
            <th>Weather</th>
            <th>Action</th>
        </tr>
    `;

    filteredData.forEach(function(data, index){

        let row = table.insertRow();

        row.insertCell(0).innerHTML = data.city;
        row.insertCell(1).innerHTML = data.temp;
        row.insertCell(2).innerHTML = data.humidity;
        let weatherEmoji = "";

if(data.weather.toLowerCase() == "sunny"){
    weatherEmoji = "☀️ Sunny";
}
else if(data.weather.toLowerCase() == "rainy"){
    weatherEmoji = "🌧️ Rainy";
}
else if(data.weather.toLowerCase() == "cloudy"){
    weatherEmoji = "☁️ Cloudy";
}
else if(data.weather.toLowerCase() == "storm"){
    weatherEmoji = "⛈️ Storm";
}
else{
    weatherEmoji = "🌤️ " + data.weather;
}

row.insertCell(3).innerHTML = weatherEmoji;

        row.insertCell(4).innerHTML =
        '<button onclick="deleteData(' + index + ')">Delete</button>';

    });

}

function deleteData(index){

    weatherData.splice(index, 1);

    localStorage.setItem("weatherData",
    JSON.stringify(weatherData));

    displayData();

}

</script>

</body>
</html>
