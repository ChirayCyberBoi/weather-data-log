<!DOCTYPE html>
<html>
<head>

<title>Weather Data Log</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
    .hero{
    height:250px;
   background-image:url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21');
    background-size:cover;
    background-position:center;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    margin-bottom:30px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}


body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:30px;
    background: linear-gradient(to right, #4facfe, #00f2fe);
}

.hero h1{
    font-family: 'Poppins', sans-serif;
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:55px;
    font-weight:700;
    letter-spacing:2px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
}
.container{
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding:30px;
    border-radius:20px;
    max-width:1000px;
    margin:auto;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

input{
    padding:12px;
    margin:10px 5px;
    border:none;
    border-radius:10px;
    width:220px;
    font-size:15px;
    outline:none;
}

button{
    padding:12px 18px;
    margin:10px 5px;
    border:none;
    background:#00bfff;
    box-shadow:0 0 10px #00bfff;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.05);
    box-shadow:0 0 20px #00bfff;
}

table{
    width:100%;
    margin-top:25px;
    border-collapse:collapse;
    background:white;
    border-radius:15px;
    overflow:hidden;
}

th{
    background:#007bff;
    color:white;
    padding:15px;
}

td{
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f2f2f2;
}

tr:hover{
    background:#dfefff;
}

table, th, td{
    border:none;
}

.search-box{
    margin-top:20px;
}
#darkModeToggle{
    position:fixed;
    top:20px;
    right:20px;
    background:black;
    color:white;
    padding:12px 18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    z-index:1000;
}

body{
    transition:0.4s;
}

body.dark{
    background: linear-gradient(-45deg, #4facfe, #00f2fe, #43e97b, #38f9d7);
background-size: 400% 400%;
animation: gradient 10s ease infinite;
    color:white;
}

body.dark table{
    background:#1e1e1e;
    color:white;
}

body.dark tr:nth-child(even){
    background:#2a2a2a;
}

body.dark input{
    background:#2a2a2a;
    color:white;
}
@keyframes gradient{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}
table{
    transition:0.3s;
}

table:hover{
    transform:scale(1.01);
    box-shadow:0 0 25px rgba(0,0,0,0.3);
}
</style>
</head>
</div>
<body>
    <button id="darkModeToggle">🌙 Dark Mode</button>
    <div class="container"></div>

    <div class="hero">

    <h1>☁️ Weather Data Log</h1>

    <p style="color:white; font-size:18px;">
        Track Weather Forecast & Climate Records
    </p>

</div>

    <input type="text" id="city" placeholder="City">

    <input type="text" id="temp" placeholder="Temperature">

    <input type="text" id="humidity" placeholder="Humidity">

    <input type="text" id="weather" placeholder="Weather Condition">

    <button onclick="addData()">Save</button>

<input type="text" id="search" placeholder="Search City">

<button onclick="searchData()">Search</button>

<table border="1" id="weatherTable">

        <tr>
            <th>City</th>
            <th>Temperature</th>
            <th>Humidity</th>
            <th>Weather</th>
            <th>Action</th>
        </tr>

    </table>
    <div id="cityModal" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
z-index:2000;
min-width:300px;
">

<h2 id="modalCity"></h2>

<p id="modalTemp"></p>
<p id="modalHumidity"></p>
<p id="modalWeather"></p>

<button onclick="closeModal()">Close</button>
</div>

    <script>

let weatherData = JSON.parse(localStorage.getItem("weatherData")) || [];
let editIndex = -1;

displayData();

function addData(){

    let city = document.getElementById("city").value;

    let temp = document.getElementById("temp").value;

    let humidity = document.getElementById("humidity").value;

    let weather = document.getElementById("weather").value;

    let data = {
        city: city,
        temp: temp,
        humidity: humidity,
        weather: weather
    };

    if(editIndex === -1){
    weatherData.push(data);
}
else{
    weatherData[editIndex] = data;
    editIndex = -1;
}

    localStorage.setItem("weatherData",
    JSON.stringify(weatherData));

    displayData();

}

function displayData(){

    let table = document.getElementById("weatherTable");

    table.innerHTML = `
        <tr>
            <th>City</th>
            <th>Temperature</th>
            <th>Humidity</th>
            <th>Weather</th>
            <th>Action</th>
        </tr>
    `;

    weatherData.forEach(function(data, index){

        let row = table.insertRow();

       row.insertCell(0).innerHTML =
'<button onclick="viewCity(' + index + ')">' + data.city + '</button>';
        row.insertCell(1).innerHTML = data.temp;
        row.insertCell(2).innerHTML = data.humidity;
       let weatherEmoji = "";

if(data.weather.toLowerCase() == "sunny"){
    weatherEmoji = "☀️ Sunny";
}
else if(data.weather.toLowerCase() == "rainy"){
    weatherEmoji = "🌧️ Rainy";
}
else if(data.weather.toLowerCase() == "cloudy"){
    weatherEmoji = "☁️ Cloudy";
}
else if(data.weather.toLowerCase() == "storm"){
    weatherEmoji = "⛈️ Storm";
}
else{
    weatherEmoji = "🌤️ " + data.weather;
}

row.insertCell(3).innerHTML = weatherEmoji;

        row.insertCell(4).innerHTML =
        '<button onclick="editData(' + index + ')">Update</button> ' +
        '<button onclick="deleteData(' + index + ')">Delete</button>';
    });

}

function searchData(){

    let search = document.getElementById("search").value.toLowerCase();

    let filteredData = weatherData.filter(function(data){

        return data.city.toLowerCase().includes(search);

    });

    let table = document.getElementById("weatherTable");

    table.innerHTML = `
        <tr>
            <th>City</th>
            <th>Temperature</th>
            <th>Humidity</th>
            <th>Weather</th>
            <th>Action</th>
        </tr>
    `;

    filteredData.forEach(function(data, index){

        let row = table.insertRow();

        row.insertCell(0).innerHTML =
'<button onclick="viewCity(' + index + ')">' + data.city + '</button>';
        row.insertCell(1).innerHTML = data.temp;
        row.insertCell(2).innerHTML = data.humidity;
        let weatherEmoji = "";

if(data.weather.toLowerCase() == "sunny"){
    weatherEmoji = "☀️ Sunny";
}
else if(data.weather.toLowerCase() == "rainy"){
    weatherEmoji = "🌧️ Rainy";
}
else if(data.weather.toLowerCase() == "cloudy"){
    weatherEmoji = "☁️ Cloudy";
}
else if(data.weather.toLowerCase() == "storm"){
    weatherEmoji = "⛈️ Storm";
}
else{
    weatherEmoji = "🌤️ " + data.weather;
}

row.insertCell(3).innerHTML = weatherEmoji;

        row.insertCell(4).innerHTML =
        '<button onclick="editData(' + index + ')">Update</button> ' +
        '<button onclick="deleteData(' + index + ')">Delete</button>';
    });

}
function editData(index){

    let data = weatherData[index];

    document.getElementById("city").value = data.city;
    document.getElementById("temp").value = data.temp;
    document.getElementById("humidity").value = data.humidity;
    document.getElementById("weather").value = data.weather;

    editIndex = index;
}
function viewCity(index){

    let data = weatherData[index];

    document.getElementById("cityModal").style.display = "block";

    document.getElementById("modalCity").innerHTML =
    "📍 " + data.city;

    document.getElementById("modalTemp").innerHTML =
    "🌡️ Temperature: " + data.temp;

    document.getElementById("modalHumidity").innerHTML =
    "💧 Humidity: " + data.humidity;

    document.getElementById("modalWeather").innerHTML =
    "☁️ Weather: " + data.weather;

}

function closeModal(){

    document.getElementById("cityModal").style.display = "none";

}

function deleteData(index){

    weatherData.splice(index, 1);

    localStorage.setItem("weatherData",
    JSON.stringify(weatherData));

    displayData();
    
}
const darkModeToggle =
document.getElementById("darkModeToggle");

darkModeToggle.addEventListener("click", function(){

    document.body.classList.toggle("dark");

});


</script>

</body>
</html>
